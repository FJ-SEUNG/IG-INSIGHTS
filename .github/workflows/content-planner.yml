name: AI Content Planner

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 0시) 실행
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 버튼

concurrency:
  group: content-planner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-content-plans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Generate Content Plans
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/content_planner.py

      - name: Commit and push content plans
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/content_plans.json
          git diff --cached --quiet || git commit -m "Update content plans $(date -u +%Y-%m-%d)"
          git push
