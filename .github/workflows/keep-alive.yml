name: Keep Alive - Prevent GitHub from disabling scheduled workflows

on:
  schedule:
    # 매주 월요일 UTC 0시 (KST 오전 9시) 실행
    - cron: '0 0 * * 1'

permissions:
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep workflows alive
        uses: actions/github-script@v7
        with:
          script: |
            // 모든 워크플로우 목록 가져오기
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            for (const workflow of workflows.data.workflows) {
              if (workflow.state === 'disabled_inactivity') {
                console.log(`Re-enabling workflow: ${workflow.name}`);
                await github.rest.actions.enableWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id
                });
              }
            }
            console.log('All workflows checked and enabled if needed.');
